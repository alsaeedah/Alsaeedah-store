name: Build Store Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'AL-SAEEDAH/**'
      - '.github/workflows/store-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -- 1. Checkout --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -- 2. Node.js ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # -- 3. Install Dependencies --------------------------------------------
      - name: Install Dependencies
        working-directory: ./AL-SAEEDAH
        run: npm install

      # -- 4. Write .env file -------------------------------------------------
      - name: Create .env file
        working-directory: ./AL-SAEEDAH
        run: |
          cat > .env << 'EOF'
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET=${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF

      # -- 5. Build the web app -----------------------------------------------
      - name: Build Web App
        working-directory: ./AL-SAEEDAH
        run: npm run build

      # -- 6. Java + Gradle ---------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # -- 7. Sync or Add Android Platform ------------------------------------
      - name: Sync or Add Android Platform
        run: |
          if [ -d "AL-SAEEDAH/android" ]; then
            echo "Android folder detected. Syncing web assets..."
            cd AL-SAEEDAH && npx cap sync android
          else
            echo "Android folder missing. Adding platform..."
            cd AL-SAEEDAH && npx cap add android
          fi

      # -- 8. Grant Gradle permission -----------------------------------------
      - name: Grant execute permission for gradlew
        working-directory: ./AL-SAEEDAH/android
        run: chmod +x gradlew

      # -- 9. Create google-services.json ------------------------------------
      - name: Create google-services.json
        working-directory: ./AL-SAEEDAH/android/app
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > google-services.json
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not found, skipping."
          fi

      # -- 10. Build Debug APK ------------------------------------------------
      - name: Build Debug APK
        working-directory: ./AL-SAEEDAH/android
        run: ./gradlew assembleDebug --no-daemon

      # -- 11. Build Release AAB (unsigned) -----------------------------------
      - name: Build Release AAB
        working-directory: ./AL-SAEEDAH/android
        run: ./gradlew bundleRelease --no-daemon

      # -- 12. Build Release APK (unsigned) -----------------------------------
      - name: Build Release APK
        working-directory: ./AL-SAEEDAH/android
        run: ./gradlew assembleRelease --no-daemon

      # -- 13. Decode Keystore ------------------------------------------------
      - name: Decode Keystore
        run: |
          if [ -n "${{ secrets.STORE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.STORE_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore
          else
            echo "STORE_KEYSTORE_BASE64 secret not found. Will skip signing if not provided."
          fi

      # -- 14. Sign and Zipalign Release APK ----------------------------------
      - name: Sign Release APK
        run: |
          if [ -f /tmp/release.keystore ]; then
            BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
            echo "Using build-tools: $BUILD_TOOLS"
            APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"
            ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/zipalign"

            UNSIGNED_APK="AL-SAEEDAH/android/app/build/outputs/apk/release/app-release-unsigned.apk"
            ALIGNED_APK="/tmp/app-release-aligned.apk"
            SIGNED_APK="AL-SAEEDAH/android/app/build/outputs/apk/release/app-release-signed.apk"

            $ZIPALIGN -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

            $APKSIGNER sign \
              --ks /tmp/release.keystore \
              --ks-key-alias "${{ secrets.STORE_KEY_ALIAS }}" \
              --ks-pass pass:"${{ secrets.STORE_KEYSTORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.STORE_KEY_PASSWORD }}" \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"

            $APKSIGNER verify "$SIGNED_APK"
            echo "APK signed successfully: $SIGNED_APK"
          else
            echo "Skipping signing step as keystore was not provided."
          fi

      # -- 15. Sign Release AAB -----------------------------------------------
      - name: Sign Release AAB
        run: |
          if [ -f /tmp/release.keystore ]; then
            UNSIGNED_AAB="AL-SAEEDAH/android/app/build/outputs/bundle/release/app-release.aab"
            SIGNED_AAB="AL-SAEEDAH/android/app/build/outputs/bundle/release/app-release-signed.aab"

            jarsigner \
              -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore /tmp/release.keystore \
              -storepass "${{ secrets.STORE_KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.STORE_KEY_PASSWORD }}" \
              -signedjar "$SIGNED_AAB" \
              "$UNSIGNED_AAB" \
              "${{ secrets.STORE_KEY_ALIAS }}"

            echo "AAB signed successfully: $SIGNED_AAB"
          fi

      # -- 16. Upload Debug APK -----------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: store-debug-apk
          path: AL-SAEEDAH/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # -- 17. Upload Release APK --------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: store-release-apk
          path: |
            AL-SAEEDAH/android/app/build/outputs/apk/release/app-release-signed.apk
            AL-SAEEDAH/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      # -- 18. Upload Release AAB --------------------------------------
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: store-release-aab
          path: |
            AL-SAEEDAH/android/app/build/outputs/bundle/release/app-release-signed.aab
            AL-SAEEDAH/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
