name: Deploy Firestore Rules + Restore Admin Claims

on:
  workflow_dispatch:
    inputs:
      admin_uid:
        description: 'Admin UID'
        required: false
        default: 'piEGB4UK4lNWBeCApyw7bQNp6l53'

jobs:
  deploy-and-restore:
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Node.js setup ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── 3. Deploy Firestore Security Rules ──────────────────────────────────
      # Uses GOOGLE_APPLICATION_CREDENTIALS — no FIREBASE_TOKEN needed.
      - name: Deploy Firestore Security Rules
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "--- Writing service account to temp file ---"
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json

          echo "--- Installing Firebase CLI ---"
          npm install -g firebase-tools

          echo "--- Deploying firestore.rules to al-saeedah8 ---"
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            firebase deploy \
              --only firestore:rules \
              --project al-saeedah8 \
              --non-interactive \
              --debug

          EXIT_CODE=$?
          shred -u /tmp/sa.json
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Firestore rules deployment FAILED (exit code $EXIT_CODE)"
            exit 1
          fi
          echo "--- Rules deployed successfully ---"

      # ─── 4. Install firebase-admin for Node scripts ───────────────────────────
      - name: Install firebase-admin
        run: npm install firebase-admin

      # ─── 5. Restore Admin Custom Claims ──────────────────────────────────────
      # Target format: { role: "super_admin", permissions: ["all"], permissionsVersion: 1 }
      - name: Restore Admin Custom Claims
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          ADMIN_UID: ${{ github.event.inputs.admin_uid }}
        run: |
          node --input-type=module <<'NODEOF'
          import { initializeApp, cert } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore, FieldValue } from 'firebase-admin/firestore';

          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_KEY);
          initializeApp({ credential: cert(sa) });

          const auth = getAuth();
          const db   = getFirestore();
          const uid  = process.env.ADMIN_UID;

          // ── Read before ──
          const before = await auth.getUser(uid);
          console.log('BEFORE claims:', JSON.stringify(before.customClaims));

          // ── Set correct claims (array format per PRD) ──
          const correctClaims = {
            role: 'super_admin',
            permissions: ['all'],
            permissionsVersion: 1
          };
          await auth.setCustomUserClaims(uid, correctClaims);
          console.log('Claims set to:', JSON.stringify(correctClaims));

          // ── Update managers document to match ──
          await db.collection('managers').doc(uid).update({
            role: 'super_admin',
            permissions: ['all'],
            is_active: true,
            updatedAt: FieldValue.serverTimestamp()
          });
          console.log('managers document updated');

          // ── Verify ──
          const after = await auth.getUser(uid);
          const claims = after.customClaims;
          console.log('AFTER  claims:', JSON.stringify(claims));

          if (claims?.role !== 'super_admin') {
            throw new Error('VERIFICATION FAILED: role claim is not super_admin');
          }
          if (!Array.isArray(claims?.permissions) || !claims.permissions.includes('all')) {
            throw new Error('VERIFICATION FAILED: permissions is not ["all"]');
          }
          if (claims?.permissionsVersion !== 1) {
            throw new Error('VERIFICATION FAILED: permissionsVersion is not 1');
          }

          console.log('Claims verification PASSED.');
          NODEOF

      # ─── 6. Verify Firestore Rules via REST API ───────────────────────────────
      # Signs in with email/password, then tries to read managers/{uid} to confirm
      # the deployed rules correctly allow isSuperAdmin() reads.
      - name: Verify Rules Allow Super Admin Read
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          ADMIN_UID: ${{ github.event.inputs.admin_uid }}
          FIREBASE_API_KEY: AIzaSyA742ivL9YWQElCmBs2gFQqlzxC70zBoWc
          FIREBASE_PROJECT_ID: al-saeedah8
        run: |
          node --input-type=module <<'NODEOF'
          import https from 'https';

          const apiKey  = process.env.FIREBASE_API_KEY;
          const project = process.env.FIREBASE_PROJECT_ID;
          const uid     = process.env.ADMIN_UID;

          const request = (method, url, body, token) => new Promise((resolve, reject) => {
            const data = body ? JSON.stringify(body) : null;
            const u = new URL(url);
            const headers = {};
            if (data) { headers['Content-Type'] = 'application/json'; headers['Content-Length'] = Buffer.byteLength(data); }
            if (token) headers['Authorization'] = 'Bearer ' + token;
            const req = https.request({ hostname: u.hostname, path: u.pathname + u.search, method, headers }, res => {
              let d = '';
              res.on('data', c => d += c);
              res.on('end', () => {
                try { resolve({ status: res.statusCode, body: JSON.parse(d) }); }
                catch { resolve({ status: res.statusCode, body: d }); }
              });
            });
            req.on('error', reject);
            if (data) req.write(data);
            req.end();
          });

          // Get service account to retrieve a fresh ID token
          // (We use the REST sign-in endpoint with a known test credential isn't available here,
          //  so we verify claims via Admin SDK instead — already done above.
          //  This step confirms deployment by fetching the current active ruleset.)
          const { initializeApp, cert } = await import('firebase-admin/app');
          const { getAuth } = await import('firebase-admin/auth');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_KEY);
          initializeApp({ credential: cert(sa) });
          const auth = getAuth();
          const user = await auth.getUser(uid);

          // Create a custom token and exchange for ID token
          const customToken = await auth.createCustomToken(uid);

          const exchange = await request('POST',
            `https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${apiKey}`,
            { token: customToken, returnSecureToken: true }
          );

          if (exchange.status !== 200) {
            throw new Error('Could not exchange custom token: ' + JSON.stringify(exchange.body));
          }
          const idToken = exchange.body.idToken;
          console.log('Got fresh ID token via custom token exchange.');

          // Now try to read managers/{uid}
          const read = await request('GET',
            `https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/documents/managers/${uid}?key=${apiKey}`,
            null, idToken
          );

          console.log('managers read status:', read.status);
          if (read.status === 200) {
            console.log('VERIFICATION PASSED: managers document readable with super_admin claims.');
          } else if (read.status === 403) {
            throw new Error('VERIFICATION FAILED: rules still block super_admin read. Check deployment.');
          } else {
            throw new Error('VERIFICATION FAILED: unexpected status ' + read.status);
          }
          NODEOF

      - name: Summary
        if: success()
        run: |
          echo "================================================="
          echo "  All steps completed successfully!"
          echo "  - Firestore Rules deployed to al-saeedah8"
          echo "  - Admin claims: { role: super_admin, permissions: [all], permissionsVersion: 1 }"
          echo "  - Rules verified: super_admin can read managers document"
          echo "  Next: Sign out and sign in again in the dashboard."
          echo "================================================="